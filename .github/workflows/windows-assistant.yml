# Windows build of the computer assistant: native helpers in MSYS2, tests, PyInstaller, self-test, zip.
# Run by hand (Actions → Windows assistant → Run workflow) or by an assistant-v* tag; the zip is the run's artifact.
name: Windows assistant

on:
  workflow_dispatch:
  push:
    tags: ['assistant-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils
          pacboy: gcc:p pkgconf:p libslirp:p opus:p

      - name: Native helpers (PPP gateway, Opus, ffmpeg)
        shell: msys2 {0}
        run: bash scripts/build_windows_helpers.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: python -m pip install -r scripts/requirements-assistant-windows.txt

      - name: Tests
        env:
          PYTHONUTF8: '1'
        working-directory: tests
        # Assistant tests only; the menu file's firmware C++ host test is checked on the Mac (MSVC headers reject strcpy).
        run: python -m unittest -v test_passport_windows test_passport_guard test_passport_ledger test_passport_menu.MenuTests.test_assistant_menu_routes_share_device_transport_and_origin_guard

      - name: Build and self-test
        env:
          PYTHONUTF8: '1'
        run: python scripts/build_passport_assistant_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: ai-passport-assistant-windows
          path: releases/ai-passport-assistant-*-preview-windows/*
          if-no-files-found: error
